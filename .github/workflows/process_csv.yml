name: Procesar Reportes CSV y Actualizar Dashboard

on:
  push:
    paths:
      - 'DBSURI/**'
      - 'META2026.xlsx'
      - 'process_data.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-data:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del Repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Entorno Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Instalar Dependencias (Pandas, Openpyxl, Numpy)
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl numpy

      - name: 4. Procesar Datos de Beneficiarios
        run: |
          python process_data.py

      - name: 5. Guardar dashboard_data.json en GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Actualización automática de datos [GitHub Actions]"
          file_pattern: "dashboard_data.json"
