name: Actualización Automática SURI (100% Nube)

on:
  workflow_dispatch:
    inputs:
      usuario:
        description: 'Usuario SURI'
        required: false
        default: ''
      password:
        description: 'Contraseña SURI'
        required: false
        default: ''
  schedule:
    - cron: '0 14 * * *' # Ejecución automática diaria programada (8:00 AM hora México)

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del Repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Entorno Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Instalar Dependencias del Proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Instalar Navegador Chromium para Playwright
        run: |
          playwright install --with-deps chromium

      - name: 5. Descargar SURI y Procesar Datos en la Nube
        env:
          INPUT_USUARIO: ${{ github.event.inputs.usuario }}
          INPUT_PASSWORD: ${{ github.event.inputs.password }}
          SECRET_USUARIO: ${{ secrets.SURI_USUARIO }}
          SECRET_PASSWORD: ${{ secrets.SURI_PASSWORD }}
        run: |
          python run_cloud_update.py

      - name: 6. Guardar dashboard_data.json en GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Actualización automática de datos SURI [GitHub Actions]"
          file_pattern: "dashboard_data.json"
